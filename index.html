<style>

  @media (prefers-color-scheme:dark){:root{--bg:#141613;--ink:#eeeee5;--muted:#a1a698;--line:#353b31;--accent:#b4c9a6;--hover:#1d221b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:64px 28px 96px;

       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{width:100%;max-width:560px}
  h1{margin:0;font:400 clamp(64px,12vw,84px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.065em}
  h1 span{color:var(--accent)}
  p{margin:0}
  .intro{margin-top:18px;color:var(--muted);font-size:14px;letter-spacing:.08em}
  nav{margin-top:52px}
  .index-label{display:flex;justify-content:space-between;padding-bottom:13px;color:var(--muted);font-size:11px;letter-spacing:.12em}
  .count{font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .entry{display:flex;align-items:center;justify-content:space-between;gap:24px;

         transition:background-color .18s ease}
  .category{display:block;margin-bottom:7px;color:var(--accent);font-size:11px;letter-spacing:.08em}
  .entry h2{margin:0;font-size:23px;line-height:1.4;font-weight:550;letter-spacing:-.025em}
  .description{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.8}
  .read{flex-shrink:0;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line)}
  .entry:hover{background:var(--hover)}
  .entry:hover .read{text-decoration-color:currentColor}
  .entry:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:2px}
  footer{margin-top:22px;color:var(--muted);font-size:11px;letter-spacing:.05em}
  @media (max-width:480px){body{padding:48px 26px 72px}nav{margin-top:40px}.entry{gap:18px}.description{font-size:13px}}
  @media (prefers-reduced-motion:reduce){.entry{transition:none}}
